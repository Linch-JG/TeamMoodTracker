[project]
name = "team-mood-tracker"
version = "0.1.0"
description = "Team Mood Tracker application for SQR project work."
authors = [{ name = "Team Mood Tracker Team" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.124.2,<0.125.0",
    "uvicorn[standard]>=0.38.0,<0.39.0",
    "streamlit>=1.52.1,<2.0.0",
    "requests>=2.32.5,<3.0.0",
]

[tool.poetry]
packages = [{ include = "team_mood_tracker", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^6.0.0"
httpx = "^0.28.1"
bandit = "^1.8.6"
locust = "^2.42.0"
pip-audit = "^2.9.0"
ruff = "^0.15.10"
black = "^26.3.1"
pre-commit = "^4.5.1"
mypy = "^1.18.2"
interrogate = "^1.7.0"
types-requests = "^2.32.4.20250913"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
target-version = ['py311']

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
exclude = ["tests", "scripts"]

[tool.interrogate]
fail-under = 100
verbose = 2
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
