name: Quality Gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  pytest-submission-flow:
    name: pytest submission flow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pytest gate
        run: poetry run pytest tests/test_mood_submission.py

  pytest:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pytest gate
        run: poetry run pytest tests/

  bandit:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run bandit
        run: poetry run bandit -r src -q

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pip-audit
        run: poetry run pip-audit

  api-smoke:
    name: API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Start API
        run: |
          TEAM_MOOD_DATABASE_PATH="${RUNNER_TEMP}/team-mood-tracker.sqlite3" \
          poetry run uvicorn team_mood_tracker.backend.app:app --host 127.0.0.1 --port 8000 >api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for API
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat api.log
          exit 1

      - name: Verify OpenAPI smoke paths
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8000/openapi.json") as response:
              spec = json.load(response)

          required_paths = {
              "/health",
              "/mood-entries",
              "/mood-entries/{entry_id}",
              "/dashboard/wellbeing-tip",
              "/analytics/daily-trends",
              "/analytics/average-mood",
              "/analytics/mood-distribution",
          }
          missing_paths = sorted(required_paths.difference(spec["paths"]))
          if missing_paths:
              raise SystemExit(f"Missing OpenAPI paths: {missing_paths}")

          missing_fields = []
          missing_examples = []
          for path, operations in spec["paths"].items():
              for method, operation in operations.items():
                  summary = operation.get("summary")
                  description = operation.get("description")
                  if not summary or not description:
                      missing_fields.append(f"{method.upper()} {path}")

                  responses = operation.get("responses", {})
                  no_content_only = all(
                      code in {"204", "304"} and "content" not in response
                      for code, response in responses.items()
                  )
                  has_example = False
                  for response in responses.values():
                      for media in response.get("content", {}).values():
                          if "example" in media or "examples" in media:
                              has_example = True
                              break
                      if has_example:
                          break
                  if not has_example and not no_content_only:
                      missing_examples.append(f"{method.upper()} {path}")

          if missing_fields:
              raise SystemExit(
                  "OpenAPI operations missing summary/description: "
                  + ", ".join(sorted(missing_fields))
              )
          if missing_examples:
              raise SystemExit(
                  "OpenAPI operations missing response examples: "
                  + ", ".join(sorted(missing_examples))
              )
          print("OpenAPI smoke check passed")
          PY

      - name: Stop API
        if: always()
        run: |
          if [ -n "${API_PID:-}" ]; then
            kill "$API_PID" || true
          fi

  coverage-gate:
    name: Coverage threshold (>= 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run coverage check
        run: poetry run pytest --cov=src/team_mood_tracker --cov-report=term-missing --cov-fail-under=80

      - name: Generate coverage report
        if: always()
        run: poetry run pytest --cov=src/team_mood_tracker --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  mypy:
    name: Type checking (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run mypy
        run: poetry run mypy src

  interrogate:
    name: Documentation gate (interrogate)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run interrogate
        run: poetry run interrogate -vv src
