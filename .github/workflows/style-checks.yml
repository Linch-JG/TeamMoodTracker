name: Style Checks

on:
  push:
  pull_request:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
    - name: Run Black
      run: poetry run black --check src/
    - name: Run Ruff
      run: poetry run ruff check src/
    - name: Radon cyclomatic complexity (grade A only, below 6)
      run: |
        out=$(poetry run radon cc src -s -n B)
        if [ -n "$out" ]; then
          echo "$out"
          exit 1
        fi
    - name: Radon maintainability index
      run: poetry run radon mi src -s
